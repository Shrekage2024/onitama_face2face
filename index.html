<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="Play Onitama in your browser, compete with friends or lose to a bot" />
    <meta property="og:title" content="Onitama App" />
    <meta property="og:description" content="Play Onitama in your browser, compete with friends or lose to a bot" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onitama.app/" />
    <meta property="og:image" content="https://onitama.app/screenshot.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": [
          "VideoGame",
          "WebApplication"
        ],
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Board Game",
        "numberOfPlayers": {
          "minValue": 1,
          "maxValue": 2
        },
        "gamePlatform": "https://onitama.app/",
        "image": "https://onitama.app/screenshot.png",
        "name": "Onitama App",
        "description": "Onitama is an elegant and simple game which captures the essence of martial arts",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1"
        },
        "offers": {
          "@type": "Offer",
          "price": "0"
        },
        "dateModified": "2021-07-16",
        "audience": {
          "@type": "PeopleAudience",
          "requiredMinAge": "4"
        }
      }
    </script>
    <title>Onitama App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
